_id: b93d53aaeb4192c2804f908e90916558
name: TI01076 ICMP Destination Host prohibited by Admin
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  payload.icmp_code: '10'
              - term:
                  payload.icmp_type: '3'
        - bool:
            must:
              - wildcard:
                  session.dpi_protocol.keyword: '*netflow*'
              - term:
                  session.icmp_type: '778'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-

  This rule detects when the source host has received an ICMP message

  stating that the "destination host is administratively prohibited."
metric_agg_key: session.id
metric_agg_type: value_count
max_threshold: 15
query_key:
- network.dst_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



