_id: 8f69635c53e63abd99ad0e1a645e7af1
alert_transport: []
description: >-
  This rule detects HTTP request template which is used for receiving data from
  C2.


  This malware has previously been associated with an APT actor that Symantec
  calls Chafer.


  The developers seem to rely on legitimate Microsoft utilities.
enable_response: false
filter:
  - wildcard:
      payload.http_get.keyword: '*/asp.asp?ui=*'

index: logvehere-probe-*
is_enabled: true
name: TI03023 Chafer Malware URL Pattern
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1043
timestamp_field: '@timestamp'
type: any
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


# PROBE_NDR_NF
rule_id: 17218985658f69635c53e63abd99ad0e1a645e7af1
