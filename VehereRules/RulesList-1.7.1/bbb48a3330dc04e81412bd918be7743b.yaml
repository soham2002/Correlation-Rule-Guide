_id: bbb48a3330dc04e81412bd918be7743b 
name: TI10170 Bat File Download From Non Standard Port
index: logvehere-probe-*
filter:
  - bool:
      must:
        - wildcard:
            payload.http_get.keyword: '*.bat'
        - bool:
            must_not:
              term:
                transport.dst_port: '80'
        - bool:
            must_not:
              term:
                transport.dst_port: '8080'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.txt
description: This rules detects batch file download from non standard port.
alert_enabled: false
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
rule_id: 1721898565bbb48a3330dc04e81412bd918be7743b
correlation_param: network.src_ip
correlation_param: network.src_ip
