_id: 7e576bd8bda0123848a027f608ed531d
name: TI10135 Executable Upload to Windows Dir using SMBv2 Lateral Movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.smb2_command: Tree Connect
        - wildcard:
            payload.smb_headers.smb2_path.keyword: '*\\C$'
        - wildcard:
            payload.smb_headers.smb2_filename.keyword: '*Windows\\*.exe'
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This rule detects the transfer of an executable file using to the Windows
  system directory.


  By default, There are 3 administrative hidden shares created in the system.
  they are "C$", "IPC$" and "ADMIN$".  These hidden shares are accessible only
  to administrators.


  Once the adversaries have access to administrator privileges they can transfer
  the tools or other files between systems in compromised environment.


  Once uploaded the attacker has numerous methods to have the executable
  launched.

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


