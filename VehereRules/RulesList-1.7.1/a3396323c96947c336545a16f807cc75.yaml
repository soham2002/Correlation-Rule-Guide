_id: a3396323c96947c336545a16f807cc75
name: TI10016 Many conversations between IP address and multiple Ports
index: logvehere-probe-*
type: metric_aggregation
filter: []
alert_transport: []

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
timestamp_field: '@timestamp'
description: >-
  This rule detects Port Scanning techniques used by attackers to discover
  services that they can exploit to break into systems.
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
query_key:
- network.dst_ip
max_threshold: 500
metric_agg_key: transport.dst_port
metric_agg_type: cardinality
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
