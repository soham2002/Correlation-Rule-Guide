        must:
        - term:
            rule_name: TI03021 Download from unknown TLDs
        - term:
            alert_sent: true
    - bool:
        must:
        - term:
            rule_name: TI07168 Old TLS version Detected
        - term:
            alert_sent: true
    - bool:
        must:
        - term:
            rule_name: TI10171 HTTPS Protocol On Non Standard Port
        - term:
            alert_sent: true
