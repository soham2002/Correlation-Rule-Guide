_id: b317e37370edeb578d32670e97cf83f0
alert_transport: []
description: This rule detects PowerShell remoting access over TCP ports 5985 and 5986.
enable_response: false
filter:
  - bool:
      must:
        - bool:
            should:
              - term:
                  transport.dst_port: 5985
              - term:
                  transport.dst_port: 5986
        - bool:
            should:
              - wildcard:
                  payload.http_host.keyword: '*NT AUTHORITY\\NETWORK SERVICE*'
              - wildcard:
                  network.detected_names.keyword: '*NT AUTHORITY\\NETWORK SERVICE*'

index: logvehere-probe-*
is_enabled: true
name: TI05504 Remote PowerShell Session
owner: vnfsadmin
priority: 3
shared: false
tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1086
  - attack.lateral_movement
  - attack.t1021.006
  - attack.t1028
timestamp_field: '@timestamp'
type: any
match_bucket_filter: []
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


