_id: dc52149a4df5b8f102e966b8f14b399a
name: TI14087 ICMP DoS Attack sFlow
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  session.icmp_code: '0'
              - term:
                  session.icmp_type: '8'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 1
enable_response: false
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule detects ICMP DoS Attack. This attack consists of sending
  'Destination Unreachable' packets to a destination and would cause the
  destination to consume resources at a relatively high rate relative to the
  traffic
metric_agg_key: session.id
metric_agg_type: value_count
max_threshold: 10
query_key:
- network.dst_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
# PROBE_NETFLOW_NDR_NF
rule_id: 1721898565dc52149a4df5b8f102e966b8f14b399a
