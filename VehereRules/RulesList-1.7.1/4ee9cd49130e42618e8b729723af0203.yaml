_id: 4ee9cd49130e42618e8b729723af0203
name: TI10141 Share Enumeration using SRVSVC service SMBv2 Lateral movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.msrpc_bind_iface_uuid: 4b324fc8167001d312785a47bf6ee188
        - match_phrase:
            payload.smb_headers.smb2_filename: srvsvc
        - match_phrase:
            payload.smb_headers.smb2_command: Tree Connect
        - match_phrase:
            payload.smb_headers.msrpc_opnum: '15'
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This rule detects Share Enumeration using the SRVSVC service.


  The “Server Service” or SRVSVC is a windows system service that provides
  server-side information to a client. This information could be about the
  network adapters on the machine, the shares on the machine etc.


  Share enuTI10141meration via SRVSVC is a way for attackers to know if there
  are shares setup on a machine apart from the hidden share

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


# PROBE_NDR_NF
rule_id: 17218985654ee9cd49130e42618e8b729723af0203
