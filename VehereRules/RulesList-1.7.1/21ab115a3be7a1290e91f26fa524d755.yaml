_id: 21ab115a3be7a1290e91f26fa524d755
alert_transport: []
description: >-
  This rule detects an unauthenticated bypass which allows an attacker to
  perform arbitrary file access. Successful exploitation of the vulnerability
  may result in information disclosure.
enable_response: false
filter:
  - wildcard:
      payload.http_get.keyword: '*?/dana/html5acc/guacamole/*'

index: logvehere-probe-*
is_enabled: true
name: TI04014 Pulse Secure Attack CVE-2019-11510
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.initial_access
  - attack.t1190
timestamp_field: '@timestamp'
type: any
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
