_id: 97fff68157e737f53151d81e52f8f428
name: TI14177 HTTP Post Flood 
index: logvehere-probe-*
filter:
  - wildcard:
      payload.http_get.keyword: POST /*
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 0
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule detects HTTP Post flood. It is a type of denial-of-service attack where an attacker overwhelms a server by sending a massive number of HTTP POST requests in a short period of time.
  
  This results in legitimate users experiencing slow performance, timeouts, or unavailability of the service, effectively causing a denial of service.users.
metric_agg_key: network.src_ip
metric_agg_type: value_count
max_threshold: 100
query_key:
- network.dst_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



