_id: 4768b9bffa73f3c2266f769af9250c60
name: TI10112 User Enumeration using SAMR service SMBv2 Lateral movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.msrpc_bind_iface_uuid: 123457781234abcdef000123456789ac
        - match_phrase:
            payload.smb_headers.msrpc_opnum: '13'
        - match_phrase:
            payload.smb_headers.msrpc_pkt_type: EnumDomains
        - match_phrase:
            payload.smb_headers.smb2_command: Tree Connect
        - match_phrase:
            payload.smb_headers.smb2_filename: samr
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json



description: >-
  This rule detects User Enumeration using the SAMR service.

  Windows contains a repository of user accounts and the NTLM hash of those accounts. This repository is called the SAM database and it's managed by the SAM (Security Accounts Manager) service. This service is remotely accessible. This is needed so that users can authenticate to a machine like a file server or any other windows machine and perform tasks.

  An unwanted effect to having this service exposed is that attackers can query this service to enumerate user accounts. Once user accounts have been enumerated the attackers can resort to the age-old technique of brute forcing or figure out the email address to send phishing emails.

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



# PROBE_NDR_NF
rule_id: 17218985654768b9bffa73f3c2266f769af9250c60
