_id: 3da46a8b70d66978b64ab3d087b93a79
name: TI08084 ICMP Unreachable Port sFlow
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  session.icmp_code: '3'
              - term:
                  session.icmp_type: '3'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule detects MITM attack, where the attacker is trying to forge
  ICMP-redirect packets in order to redirect traffic to itself which eventually
  results in gathering all data passing through it.
metric_agg_key: session.id
metric_agg_type: value_count
max_threshold: 2
query_key:
- network.src_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
