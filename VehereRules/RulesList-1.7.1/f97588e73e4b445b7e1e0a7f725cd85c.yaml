_id: f97588e73e4b445b7e1e0a7f725cd85c
name: TI01078 ICMP Destination Network prohibited by Admin sFlow
index: logvehere-probe-*
type: any
filter:
  - bool:
      must:
        - term:
            session.icmp_code: 9
        - term:
            session.icmp_type: '3'
alert_transport: []
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'
description: >-
  This rule detects when the source host has received an ICMP message that the
  "destination network is administratively prohibited."
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
# PROBE_NDR_NF
rule_id: 1721898565f97588e73e4b445b7e1e0a7f725cd85c
