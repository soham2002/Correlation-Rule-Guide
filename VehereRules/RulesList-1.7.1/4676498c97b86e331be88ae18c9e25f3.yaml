_id: 4676498c97b86e331be88ae18c9e25f3
alert_transport: []
description: This rule detects post exploitation framework ‘Empire’.
enable_response: false
filter:
  - bool:
      must:
        - term:
            payload.user_agent.keyword: >-
              Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like
              Gecko
        - bool:
            should:
              - wildcard:
                  payload.http_get.keyword: '*/admin/get.php'
              - wildcard:
                  payload.http_get.keyword: '*/news.php'
              - wildcard:
                  payload.http_get.keyword: '*/login/process.php'

index: logvehere-probe-*
is_enabled: true
name: TI03015 Empire UserAgent URI Combo
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.defense_evasion
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1043
timestamp_field: '@timestamp'
type: any
match_bucket_filter: []
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


