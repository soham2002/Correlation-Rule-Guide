_id: db2a9dec94a62b8325d244cd887ef1af
name: TI01156 SMB Recon Activity Detected
index: logvehere-probe-*
filter:
  - bool:
      must:
        - bool:
            should:
              - term:
                  transport.dst_port: '445'
              - term:
                  transport.dst_port: '139'
        - bool:
            should:
              - bool:
                  must:
                    - term:
                        session.client_tcp_initial_flags.keyword: S
                    - term:
                        session.server_tcp_initial_flags.keyword: AR
                    - range:
                        session.total_packets:
                          lte: '2'
              - bool:
                  must:
                    - term:
                        session.netflow_tcp_flags.keyword: ARS
                    - range:
                        session.total_packets:
                          lte: '2'
              - bool:
                  must:
                    - term:
                        session.flow_tcp_flags.keyword: ARS
                    - range:
                        session.total_packets:
                          lte: '2'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
enable_end_date: false
ruleRow: []
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
metric_agg_key: network.dst_ip
query_key:
- transport.dst_port
metric_agg_type: cardinality
max_threshold: 20
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
description: >-
  This Rule detects SMB reconnaissance targets the Server Message Block (SMB) protocol used in Windows-based networks for file and printer sharing. The attacker scans for systems with open SMB ports attempting to enumerate shared user accounts and system information. This reconnaissance allows the attacker to map the network's structure and identify potential vulnerabilities for further exploitation or unauthorized access.
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



