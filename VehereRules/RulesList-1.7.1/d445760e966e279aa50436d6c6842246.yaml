_id: d445760e966e279aa50436d6c6842246
name: TI10012 High data transfer to a country
index: logvehere-probe-*
type: metric_aggregation
filter: []
alert_transport: []

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
timestamp_field: '@timestamp'
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
query_key:
- network.dst_geo_ip.country_name.keyword
max_threshold: 27500000000
metric_agg_key: session.received_bytes
metric_agg_type: sum
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
description: >-
  This rule detects high data transfer to a country. This points to possible
  presence of APT group in the country.
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
owned: true
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



