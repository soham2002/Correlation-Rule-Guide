_id: 5aa0408c86a8f428c1ffb0f51c924cc1 
name: TI10166 Executable Download from IP address
index: logvehere-probe-*
filter:
  - regexp:
      payload.http_host: '([0-9]{1,3}\.){3}[0-9]{1,3}'
  - bool:
      should:
        - wildcard:
            payload.http_get.keyword: '*.exe'
        - wildcard:
            payload.http_get.keyword: '*.dll'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.txt
description: This rule detects executable file download from IP address.
alert_enabled: false
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
rule_id: 17218985655aa0408c86a8f428c1ffb0f51c924cc1
correlation_param: network.src_ip
