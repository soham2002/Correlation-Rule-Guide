_id: 9ed3a438d2d95ac21f05239e06da8072
name: TI01077 ICMP Destination Host Unknown sFlow
index: logvehere-probe-*
type: any
filter:
  - bool:
      must:
        - term:
            session.icmp_code: 7
        - term:
            session.icmp_type: '3'
alert_transport: []
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'
description: >-
  This rule detects when source host has received an ICMP message that a
  "destination host unknown" error has occurred.
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
# PROBE_NDR_NF
rule_id: 17218985659ed3a438d2d95ac21f05239e06da8072
