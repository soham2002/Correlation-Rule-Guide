_id: cda802f19175dfb50c2ee41d3cb64362
alert_transport: []
description: >-
  This rule detects a combination of authorization bypass and information
  disclosure being actively used against unpatched system.


  Exploitation of Multiple vulnerabilities have been discovered in Citrix. These
  vulnerabilities, if exploited, could result in a number of security issues.
enable_response: false
filter:
  - bool:
      should:
        - bool:
            should:
              - wildcard:
                  payload.http_get.keyword: '*/rapi/filedownload?filter=path:%2F*'
        - bool:
            must:
              - wildcard:
                  payload.http_get.keyword: '*/pcidss/report*'
              - wildcard:
                  payload.http_get.keyword: '*type=all_signatures*'
              - wildcard:
                  payload.http_get.keyword: '*sig_name=_default_signature_*'

index: logvehere-probe-*
is_enabled: true
name: TI04006 Citrix ADS Exploitation CVE-2020-8193 CVE-2020-8195
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.initial_access
  - attack.t1190
timestamp_field: '@timestamp'
type: any
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


# PROBE_NDR
rule_id: 1721898565cda802f19175dfb50c2ee41d3cb64362
