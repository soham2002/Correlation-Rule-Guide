_id: 34b364c54d032559594072f2526b4470
name: TI09159 LDAP Account Enumeration
index: logvehere-probe-*
filter:
  - term:
      payload.ldap_headers.bindresponse_code: '49'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
owner: vnfsadmin
shared: false
priority: 0
enable_response: false
enable_end_date: false
ruleRow: []
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule detects attempts to enumerate valid Domain Users via LDAP protocol. Specifically, this rule checks invalid credentials sent to the domain controller.

  Adversaries may attempt to get a listing of domain accounts. This information can help adversaries determine which domain accounts exist to aid in follow-on behavior such as targeting specific accounts which possess particular privileges.
metric_agg_key: payload.ldap_headers.bindresponse_code
metric_agg_type: value_count
max_threshold: 20
query_key:
- network.src_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



