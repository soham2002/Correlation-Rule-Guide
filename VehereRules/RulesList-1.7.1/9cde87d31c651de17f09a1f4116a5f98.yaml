_id: 9cde87d31c651de17f09a1f4116a5f98
name: TI10123 Remote Registry System Services Key smbv2 Lateral Movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.smb2_command: Tree Connect
        - match_phrase:
            payload.smb_headers.msrpc_opnum: '22'
        - match_phrase:
            payload.smb_headers.msrpc_key_name: System\\CurrentControlSet\\services
        - match_phrase:
            payload.smb_headers.msrpc_pkt_type: OpenHKLM
        - match_phrase:
            payload.smb_headers.msrpc_key_file: ImagePath
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This rule indicates remote modification of registry key using system Services
  key


  the Services key path controls what drivers are loaded on the windows system
  at boot time. An attacker can create a subkey with a name and then point the
  location to the malicious ",sys" file.

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


# PROBE_NDR_NF
rule_id: 17218985659cde87d31c651de17f09a1f4116a5f98
