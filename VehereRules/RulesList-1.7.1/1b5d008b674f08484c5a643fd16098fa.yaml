_id: 1b5d008b674f08484c5a643fd16098fa
alert_transport: []
description: >-
  This rule detects payload download from PwnDrp servers - commonly used by
  attackers.


  A new open source tool has streamlined the process of sharing payloads online
  without using a third-party server such as Dropbox or other hosting
  services.


  PwnDrop, the self-deployable file hosting service, was created to enable pen
  testers to share files over HTTP, HTTPS, and WebDAV, using their own server.
enable_response: false
filter:
  - wildcard:
      payload.http_get.keyword: '*/pwndrop/*'

index: logvehere-probe-*
is_enabled: true
name: TI03018 PwnDrp Access
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1043
  - attack.t1102.001
  - attack.t1102.003
  - attack.t1102
timestamp_field: '@timestamp'
type: any
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


