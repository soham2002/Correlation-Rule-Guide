_id: 8e1c3178c02f148469b32655c0b629ff
name: TI10132 SID enumeration via LSA service SMBv1 Lateral Movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.msrpc_bind_iface_uuid: 123457781234abcdef000123456789ab
        - match_phrase:
            payload.smb_headers.smb_command: Tree Connect AndX
        - match_phrase:
            payload.smb_headers.msrpc_opnum: '44'
        - match_phrase:
            payload.smb_headers.smb_filename: lsarpc
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This rule detects SID enumeration using the LSA service.

  The “Local System Authority” is the system service that handles authentication, security policy enforcement etc. Even Windows objects like machines, users, etc have a security identifier or SID.

  Enumerating SIDs is one way for attackers to enumerate users. In addition in cases of attackers like the “Golden Ticket” attack, gathering the domain SID is critical.
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


# PROBE_NDR_NF
rule_id: 17218985658e1c3178c02f148469b32655c0b629ff
