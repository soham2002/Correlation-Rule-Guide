_id: 45f5b13c1b80e672851f324162e8a74a
name: TI08101 ICMP Unreachable Host
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  payload.icmp_type: '3'
              - term:
                  payload.icmp_code: '1'
        - bool:
            must:
              - wildcard:
                  session.dpi_protocol.keyword: '*netflow*'
              - term:
                  session.icmp_type: '769'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule detects when a server is trying to reach a destination address and a device. The path that is authoritative for routing to that destination address, if it decides it cannot reach the destination, then the rule gets triggered. This happedns when the client is malicious or spoofing its source address.
metric_agg_key: session.id
metric_agg_type: value_count
max_threshold: 50
query_key:
- network.src_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



