_id: 0d6c83762b97699e220cc22d4258470c
name: TI10010 Many sessions from multiple sources to one destination IP
index: logvehere-probe-*
filter: []
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 0
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >-
  This rule alerts when several sources communicate with one destination in a short period of time, which depending on the volume of traffic could be a DDoS. 

  A Denial of Service (DoS) attack is a malicious attempt to affect the availability of a targeted system, such as a website or application, to legitimate end users. 
metric_agg_key: network.src_ip
metric_agg_type: cardinality
max_threshold: 10000
query_key:
- network.dst_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



