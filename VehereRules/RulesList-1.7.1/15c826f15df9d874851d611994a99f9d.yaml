_id: 15c826f15df9d874851d611994a99f9d
alert_transport: []
description: >-
  This rule detects Malleable OCSP Profile that work with Cobalt strike.


  Malleable C2 is a domain specific language to redefine indicators in Beacon's
  communication.
enable_response: false
filter:
  - bool:
      must:
        - wildcard:
            payload.http_get.keyword: '*/oscp/*'
        - term:
            payload.http_host: ocsp.verisign.com

index: logvehere-probe-*
is_enabled: true
name: TI03038 CobaltStrike Malleable (OCSP) Profile
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.defense_evasion
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1043
timestamp_field: '@timestamp'
type: any
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


