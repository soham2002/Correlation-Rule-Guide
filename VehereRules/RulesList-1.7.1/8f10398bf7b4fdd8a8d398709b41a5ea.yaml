_id: 8f10398bf7b4fdd8a8d398709b41a5ea
name: TI01075 ICMP Communication prohibited by Admin sFlow
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  session.icmp_code: '13'
              - term:
                  session.icmp_type: '3'

alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
description: >
  This rule detects when a source host has received an ICMP message that
  "communication is administratively prohibited." This is generated if a router
  cannot forward a packet due to administrative filtering.
metric_agg_key: session.id
metric_agg_type: value_count
max_threshold: 2
query_key:
- network.src_ip
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
# PROBE_NETFLOW_NDR_NF
rule_id: 17218985658f10398bf7b4fdd8a8d398709b41a5ea
