_id: 7e25503abe20ac9939b7e62c76f95e08
alert_transport: []
description: >-
  This rule is triggered when User-Agent strings typically seen as part of
  exploit frameworks are found in the network.
enable_response: false
filter:
  - bool:
      should:
        - wildcard:
            payload.user_agent: Internet Explorer *
        - wildcard:
            payload.user_agent: '*wordpress hash grabber*'
        - wildcard:
            payload.user_agent: '*exploit*'
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; Metasploit RSPEC)
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; MSIE 6.1; Windows NT)
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0)
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.0; Trident/4.0)
        - term:
            payload.user_agent: >-
              Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Trident/4.0;
              SIMBAR={7DB0F6DE-8DE7-4841-9084-28FA914B0F2E}; SLCC1; .N
        - term:
            payload.user_agent: >-
              Mozilla/5.0 (compatible; Googlebot/2.1;
              +http://www.google.com/bot.html)
        - term:
            payload.user_agent: >-
              Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US) AppleWebKit/525.13
              (KHTML, like Gecko) Chrome/4.0.221.6 Safari/525.13
        - term:
            payload.user_agent: >-
              Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; WOW64;
              Trident/5.0; MAAU)
        - term:
            payload.user_agent: Mozilla/5.0
        - term:
            payload.user_agent: Mozilla/4.0 (compatible; SPIPE/1.0
        - term:
            payload.user_agent: 'Mozilla/5.0 (Windows NT 6.3; rv:39.0) Gecko/20100101 Firefox/35.0'
        - term:
            payload.user_agent: X-FORWARDED-FOR
        - term:
            payload.user_agent: Sametime Community Agent
        - term:
            payload.user_agent: DotDotPwn v2.1
        - term:
            payload.user_agent: SIPDROID
        - term:
            payload.user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win32; x32; rv:60.0)'
        - term:
            payload.user_agent: >-
              Mozilla/6.0 (X11; Linux x86_64; rv:24.0) Gecko/20140205
              Firefox/27.0 Iceweasel/25.3.0

index: logvehere-probe-*
is_enabled: true
name: TI03033 Exploit Framework User Agent Seen In Network Traffic
owner: vnfsadmin
priority: 1
shared: false
tags:
  - attack.command_and_control
  - attack.t1071.001
timestamp_field: '@timestamp'
type: any
match_bucket_filter: []
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


