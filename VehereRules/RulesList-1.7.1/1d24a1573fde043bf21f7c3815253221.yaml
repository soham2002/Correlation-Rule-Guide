_id: 1d24a1573fde043bf21f7c3815253221
name: TI10127 Exe Upload to System32 Dir using SMBv2 Lateral Movement
index: logvehere-probe-*
filter:
  - bool:
      must:
        - match_phrase:
            payload.smb_headers.smb2_command: Tree Connect
        - wildcard:
            payload.smb_headers.smb2_path.keyword: '*\\C$'
        - wildcard:
            payload.smb_headers.smb2_filename.keyword: Windows\\System32\\*.exe
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 2
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This rule detects the transfer of an executable file in the "System32" directory. The system32 folder is a critical folder containing all the executables typically used from the Windows command line. It may be noted that once an attacker has privileged access the choice of location is unpredictable. The attacker could drop the file in the C$ driver, the system32 folder or even the temp folder.

alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


