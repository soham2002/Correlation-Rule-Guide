_id: f8a64d18309feb9ee70c54b215041b26
name: TI01155 RPC Recon Activity Detected
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  transport.dst_port: '135'
              - range:
                  session.total_packets:
                    lte: '2'
              - term:
                  session.netflow_tcp_flags.keyword: ARS
        - bool:
            must:
              - term:
                  transport.dst_port: '135'
              - range:
                  session.total_packets:
                    lte: '2'
              - term:
                  session.flow_tcp_flags.keyword: ARS
        - bool:
            must:
              - term:
                  transport.dst_port: '135'
              - term:
                  session.client_tcp_initial_flags.keyword: S
              - term:
                  session.server_tcp_initial_flags.keyword: AR
              - range:
                  session.total_packets:
                    lte: '2'
alert_transport: []
scheduler: '* * * * *'
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
enable_end_date: false
ruleRow: []
timestamp_field: '@timestamp'
type: metric_aggregation
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
sync_bucket_interval: false
allow_buffer_time_overlap: false
use_run_every_query_size: false
metric_agg_key: network.dst_ip
metric_agg_type: cardinality
max_threshold: 20
query_key:
- transport.dst_port
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
description: >-
  This rule detects RPC Recon. The client is trying to scan for open RPC port on
  the destination systems.  The attacker identifies systems with open RPC ports
  and seeks to exploit weaknesses in the protocol or related services. By
  gaining insights into the network's configuration and service offerings, the
  attacker can plan targeted attacks to compromise or disrupt critical systems.

alert:
  - lsalert
