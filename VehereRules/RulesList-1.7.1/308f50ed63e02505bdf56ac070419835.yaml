_id: 308f50ed63e02505bdf56ac070419835
name: TI01081 ICMP Unreachable Host Type of Service
index: logvehere-probe-*
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  payload.icmp_type: '3'
              - term:
                  payload.icmp_code: '12'
        - bool:
            must:
              - wildcard:
                  session.dpi_protocol.keyword: '*netflow*'
              - term:
                  session.icmp_type: '780'
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
description: >-
  This rule detects when source host has received an ICMP message stating that
  "target host is unreachable due to the specified Type of Service."



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


