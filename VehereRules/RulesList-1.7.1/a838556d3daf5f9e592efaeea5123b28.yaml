_id: a838556d3daf5f9e592efaeea5123b28
alert_transport: []
buffer_time:
  minutes: 15
bucket_interval:
  minutes: 1
description: >-
  This rule detects DNS Tunneling attempts via several CNAME records sent over
  an interval which is unusual behavior. huge number of DNS queries for a single
  parent domain, this is an indicator for malicious C2 traffic. In this case,
  DNS is used to transfer data instead of its intended purpose.
enable_response: false
filter:
  - wildcard:
      payload.dns_headers.cname.keyword: '*'

index: logvehere-probe-*
is_enabled: true
max_threshold: 1000
metric_agg_key: payload.dns_domain_names.keyword
metric_agg_type: cardinality
name: TI01073 Possible DNS Tunneling
owner: vnfsadmin
priority: 2
query_key:
- payload.dns_headers.cname.keyword
shared: false
tags:
  - attack.command_and_control
  - attack.t1071
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048
  - attack.t1048.003
timestamp_field: '@timestamp'
type: metric_aggregation
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



