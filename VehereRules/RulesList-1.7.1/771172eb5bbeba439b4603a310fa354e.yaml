_id: 771172eb5bbeba439b4603a310fa354e
name: TI01088 ICMP Isolated Source Host sFlow
index: logvehere-probe-*
type: any
filter:
  - bool:
      must:
        - term:
            session.icmp_code: 8
        - term:
            session.icmp_type: '3'
alert_transport: []
is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'
description: >-
  This rule triggers when ICMP sender/router has been configured to not forward
  packets from source.
alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]
# PROBE_NDR_NF
rule_id: 1721898565771172eb5bbeba439b4603a310fa354e
