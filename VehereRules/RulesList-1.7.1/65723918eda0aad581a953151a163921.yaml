_id: 65723918eda0aad581a953151a163921
name: TI01083 ICMP Unreachable Network Type of Service
index: logvehere-probe-*
type: any
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  payload.icmp_code: 11
              - term:
                  payload.icmp_type: '3'
        - bool:
            must:
              - wildcard:
                  session.dpi_protocol.keyword: '*netflow*'
              - term:
                  session.icmp_type: '779'
alert_transport: []

is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'
description: >-
  This rule detects when the source host has received an ICMP message that the
  "network is unreachable for the specified Type Of Service."



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


