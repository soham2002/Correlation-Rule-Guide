_id: 3350b1cf64bc682ab8598d7712b914a9
alert_transport: []
description: >-
  This rule detects files exfiltration to Drop Box - technique used by APT40.

  Exploitation of vulnerabilities in VPNs, public facing applications, and
  compromised admin accounts to gain initial access to their targets. APT 40
  used GitHub to both store malware and stolen data, which was concealed using
  steganography. The hackers also used Dropbox API keys in commands to upload
  stolen data directly to conspiracy-controlled Dropbox accounts to make it
  appear to network defenders that such data exfiltration was an employee’s
  legitimate use of the Dropbox service.
enable_response: false
filter:
  - bool:
      must:
        - term:
            payload.user_agent.keyword: >-
              Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML,
              like Gecko) Chrome/36.0.1985.143 Safari/537.36
        - bool:
            should:
              - term:
                  payload.http_host.keyword: api.dropbox.com
              - term:
                  network.detected_names.keyword: api.dropbox.com

index: logvehere-probe-*
is_enabled: true
name: TI03037 APT40 Dropbox Tool User Agent
owner: vnfsadmin
priority: 0
shared: false
tags:
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1043
  - attack.exfiltration
  - attack.t1567.002
  - attack.t1048
timestamp_field: '@timestamp'
type: any
match_bucket_filter: []
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
use_ssl: true
verify_certs: false
es_username: admin
es_password: admin
scheduler: '* * * * *'



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]



