_id: e02f5691175fe692e284cd6968239a56
name: TI01085 ICMP Precedence below than minimum required
index: logvehere-probe-*
type: any
filter:
  - bool:
      should:
        - bool:
            must:
              - term:
                  payload.icmp_code: 15
              - term:
                  payload.icmp_type: '3'
        - bool:
            must:
              - wildcard:
                  session.dpi_protocol.keyword: '*netflow*'
              - term:
                  session.icmp_type: '783'
alert_transport: []

is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
timestamp_field: '@timestamp'
ls_output_file_path: /var/log/ruleengine/vnfsalert.json
scheduler: '* * * * *'
description: >-
  This rule detects Network scanning attempt. This type of ICMP message is sent
  by the first hop router to a host to indicate that  requested precedence is
  not permitted for the particular combination of (IP, port, protocol).



alert:
  - lsalert
# Uncomment below lines and Put the command and the arguments as each array elements. 'command: ["/bin/send_alert", "--option", "%(filed.subfield)"]'
#  - command
#command: ["/bin/send_alert", "--username", "%(username)"]


