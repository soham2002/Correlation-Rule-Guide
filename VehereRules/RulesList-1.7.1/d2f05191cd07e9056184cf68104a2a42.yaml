_id: d2f05191cd07e9056184cf68104a2a42
name: TI01102 Invalid TCP Flags Detected in the flow
index: logvehere-probe-*
filter:
  - exists:
      field: transport.alert
alert_transport: []
scheduler: '* * * * *'

is_enabled: true
shared: false
owner: vnfsadmin
priority: 3
enable_response: false
enable_end_date: false

ruleRow: []
timestamp_field: '@timestamp'
type: any
ls_output_file_path: /var/log/ruleengine/vnfsalert.json




description: >-
  This alert indicates that the attacker is trying to gather information about
  the machine into which intentionally the packet is sent with invalid TCP flags
  set.

alert:
  - lsalert
